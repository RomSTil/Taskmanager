name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2,<27"
      - run: pip install -e './backend[dev]' -e './mcp-bridge[dev]'
      - run: ruff check backend mcp-bridge
      - run: bandit -r backend/app mcp-bridge/taskman_mcp -q
      - run: pytest backend/tests mcp-bridge/tests --cov=backend/app --cov-report=term-missing
      - run: pip-audit --progress-spinner off --vulnerability-service osv

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/task manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/task manager/src-tauri
      - working-directory: frontend/task manager
        run: npm ci
      - working-directory: frontend/task manager
        run: npm test
      - working-directory: frontend/task manager
        run: npm run build
      - working-directory: frontend/task manager/src-tauri
        run: cargo check
