name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e './backend[dev]' -e './mcp-bridge[dev]'
      - run: ruff check backend mcp-bridge
      - run: pytest backend/tests mcp-bridge/tests --cov=backend/app --cov-report=term-missing

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm test
      - working-directory: desktop
        run: npm run build
      - working-directory: desktop/src-tauri
        run: cargo check
