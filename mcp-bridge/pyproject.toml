[project]
name = "taskman-mcp"
version = "0.1.0"
description = "Local Codex MCP bridge for a global Taskman server"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
taskman-mcp = "taskman_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskman_mcp"]
