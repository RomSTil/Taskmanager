[package]
name = "taskman"
version = "0.1.0"
description = "Personal tasks and Markdown knowledge workspace"
authors = ["Taskman"]
edition = "2021"

[lib]
name = "taskman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
notify = "8"
walkdir = "2"
